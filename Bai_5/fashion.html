<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fashion.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Document</title>
</head>

<body>
    <!-- Phần đầu trang-->
    <header>
        <div class="top-head region">
            <div class="logo">
                <h1>Fashi</h1>
            </div>
            <div class="search-bar">
                <div class="dropdown-list">
                    <select>
                        <option>All Categories</option>
                        <option>Dress</option>
                        <option>Shirt</option>
                        <option>T-Shirt</option>
                    </select>
                </div>
                <div class="search">
                    <input type="text" placeholder="What do you need?">
                </div>
                <div>
                    <button class="search-button"><i class="fa-solid fa-magnifying-glass"></i></button>
                </div>
            </div>
            <div class="icon">
                <i class="fa-solid fa-bag-shopping"></i>
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
        <nav class="navigation region">
            <div class="dropdown-department">
                <div><i class="fa-solid fa-bars"></i>
                    <select class="dropdown-select">
                        <option>ALL DEPARTMENTS</option>
                        <option>11</option>
                        <option>23</option>
                        <option>54</option>
                        <option>77</option>
                        <option>44</option>
                    </select>
                </div>
            </div>
            <div class = "subnavigation">
                <h3>HOME</h3>
                <h3>SHOP</h3>
                <h3>COLLETION</h3>
                <h3>BLOG</h3>
                <h3>CONTACT</h3>
                <h3>PAGES</h3>
            </div>
        </nav>
    </header>

<!-- Phần chủ đạo -->
    <main class="content region">
        <div class="container">
            <div class="subcontainer">
                <div class="frame">
                    <div class="imgframe1"></div>
                    <h4>Áo polo nam</h4>
                    <p>170.000 VND</p>
                </div>
                <div class="frame">
                    <div class="imgframe2"></div>
                    <h4>Áo sơ mi nam</h4>
                    <p>800.000 VND</p>
                </div>
            </div>
            <div class="subcontainer">
                <div class="frame">
                    <div class="imgframe3"></div>
                    <h4>Váy maxi</h4>
                    <p>400.000 VND</p>
                </div>
                <div class="frame">
                    <div class="imgframe4"></div>
                    <h4>Áo khoác nam</h4>
                    <p>400.000 VND</p>
                </div>
            </div>
            <div class="subcontainer">
                <div class="frame">
                    <div class="imgframe5"></div>
                    <h4>Áo lacoste</h4>
                    <p>5.000.000 VND</p>
                </div>
                <div class="frame">
                    <div class="imgframe6"></div>
                    <h4>Giày thể thao</h4>
                    <p>300.000 VND</p>
                </div>
            </div>
        </div>
    </main>
    
<!-- Phần chân trang -->
    <footer class = "footer region">
        <div class="head-footer region">
            <h1><i class="fa-regular fa-circle"></i>banToni</h1>
            <h1><i class="fa-solid fa-check-double"></i>vCorp</h1>
            <h1><i class="fa-brands fa-reddit-alien"></i>Alitume</h1>
            <h1><i class="fa-regular fa-square"></i>zukata</h1>
            <h1><i class="fa-solid fa-barcode"></i>vicinck</h1>
        </div>
        <div class="main-footer region">
            <div class="foot-container1">
                <div class="logo">
                    <h1>Fashi</h1>
                </div>
                <p></p>
            </div>
            <div class="foot-container2"></div>
            <div class="foot-container3"></div>
            <div class="foot-container4"></div>
        </div>
    </footer>
</body>

</html>
